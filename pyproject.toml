[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-core"
version = "0.1.0"
description = "Persistent intelligence runtime for RUNE"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rune-api = "rune.api:serve"
rune-desktop = "rune.desktop.windows:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
connectors = ["httpx>=0.27", "mcp>=1.0"]
google = ["google-api-python-client>=2.150", "google-auth>=2.35", "google-auth-oauthlib>=1.2"]
notion = ["notion-client>=2.2"]
browser = ["playwright>=1.48"]
research = ["httpx>=0.27"]
all-connectors = ["httpx>=0.27", "mcp>=1.0", "google-api-python-client>=2.150", "google-auth>=2.35", "google-auth-oauthlib>=1.2", "notion-client>=2.2", "playwright>=1.48"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rune*"]

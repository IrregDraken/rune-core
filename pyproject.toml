[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-core"
version = "0.1.0"
description = "Persistent intelligence runtime for RUNE"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rune-api = "rune.api:serve"
rune-desktop = "rune.desktop.windows:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rune*"]

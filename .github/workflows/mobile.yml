name: RUNE Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/mobile-app-foundation']
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project if absent
        working-directory: apps/mobile
        run: if [ ! -d android ]; then flutter create --platforms=android,ios .; fi
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Build Android release
        working-directory: apps/mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rune-mobile-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

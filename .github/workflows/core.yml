name: RUNE Core CI

on:
  push:
    branches: [main]
    paths: ['rune/**', 'tests/**', 'pyproject.toml', '.github/workflows/core.yml']
  pull_request:
    paths: ['rune/**', 'tests/**', 'pyproject.toml', '.github/workflows/core.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core
        run: python -m pip install -e '.[dev]'
      - name: Test core
        run: pytest -q
